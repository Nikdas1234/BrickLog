name: Android-App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

      # Web-Inhalt bauen und in das Android-Projekt kopieren
      - run: npm run build:app

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.BRICKLOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret BRICKLOG_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bricklog.p12"
          echo "BRICKLOG_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          BRICKLOG_KEYSTORE: ${{ runner.temp }}/bricklog.p12
          BRICKLOG_KEYSTORE_PASSWORD: ${{ secrets.BRICKLOG_KEYSTORE_PASSWORD }}
          # Die Nummer des Laufs wächst mit jedem Bau; Android braucht das für Updates.
          BRICKLOG_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BrickLog.apk"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs BrickLog.apk | head -n 3

      # Eine einzige, fortlaufend aktualisierte Veröffentlichung "apk". Dadurch bleibt
      # die Download-Adresse immer gleich.
      - name: APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="BrickLog $BRICKLOG_VERSION_NAME für Android (Bau ${{ github.run_number }})"
          NOTES="Die Datei **BrickLog.apk** auf dem Handy herunterladen und antippen. Eine vorhandene BrickLog-App wird dabei aktualisiert, die Daten bleiben erhalten."
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "$TITLE" --notes "$NOTES" --latest
          gh release upload apk BrickLog.apk --clobber
          gh release edit apk --title "$TITLE" --notes "$NOTES"
